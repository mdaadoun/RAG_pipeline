[tool.poetry]
name = "rag-pipeline"
version = "0.1.0"
description = "Ingestion Pipeline & Information Loss Audit Engine for RAG Systems"
authors = ["Michael <michael@example.com>"]
readme = "README.md"
packages = [{include = "ingestion", from = "src"}]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
structlog = "^24.1.0"
tiktoken = "^0.6.0"
typer = {extras = ["all"], version = "^0.12.0"}
rich = "^13.7.1"
python-dotenv = "^1.0.1"
tenacity = "^8.2.3"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.1"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.23.5"
ruff = "^0.3.3"
mypy = "^1.9.0"
pre-commit = "^3.6.2"

[tool.poetry.scripts]
ingest = "ingestion.cli:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "UP017"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true
disallow_untyped_decorators = false
ignore_missing_imports = true
exclude = [
    '^data/',
    '^tests/fixtures/',
]


[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "--cov=src --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
fail_under = 80
